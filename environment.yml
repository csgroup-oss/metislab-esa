name: notebook
channels:
  - conda-forge
dependencies:
  # Python version of metislab-core: avoid any change by the update
  - python=3.12
  # Geospatial (ESA)
  - basemap
  - basemap-data-hires
  - cartopy
  - cfgrib
  - fiona
  - folium
  - gdal
  - geojson
  - geopandas
  - geopy
  - h5netcdf
  - ipyleaflet
  # mapboxgl imports IPython.core.display.display, removed in IPython 9
  - ipython<9
  - ipyvolume
  - libgdal-grib
  - libgdal-hdf5
  - libgdal-jp2openjpeg
  - libgdal-netcdf
  - netcdf4
  - opencv
  - openeo
  - owslib
  - pysolar
  - rasterio
  - rasterstats
  - rio-cogeo
  - rio-tiler
  - rioxarray
  - rtree
  - shapely
  - spatialpandas
  - xarray-spatial
